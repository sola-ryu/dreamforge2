services:
  dreamforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dreamforge
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/data/dreamforge.db
      - DATA_DIR=/data/projects
      - PUBLIC_ALLOW_REGISTRATION=${PUBLIC_ALLOW_REGISTRATION:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@dreamforge.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      # Trust the X-Forwarded-Proto header from a reverse proxy so the app sees the
      # real request protocol. Required for form submissions (SvelteKit CSRF check)
      # and secure cookies to work behind a proxy. Your proxy must set the header.
      # Note: direct plain-HTTP access without a proxy is not supported for forms —
      # use a reverse proxy (http or https) in front of the container.
      - PROTOCOL_HEADER=x-forwarded-proto
    volumes:
      - dreamforge-data:/data

volumes:
  dreamforge-data:
    driver: local
